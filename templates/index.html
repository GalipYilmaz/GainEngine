<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GainEngine - Workout Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>GainEngine</h1>

        <div class="form-group">
            <label for="bodyPart">Target Body Part:</label>
            <select id="bodyPart">
                </select>
        </div>

        <div class="form-group">
            <label>Available Equipment:</label>
            <div id="equipmentList" class="checkbox-grid">
                </div>
        </div>

        <div class="form-group">
            <label for="numExercises">Number of Exercises:</label>
            <input type="number" id="numExercises" value="5" min="1" max="10">
        </div>

        <button id="generateBtn">Generate Workout</button>

        <div id="results" class="results-container"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
