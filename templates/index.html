<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GainEngine - Smart Workout Planner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>GainEngine</h1>

        <div class="form-group">
            <label for="splitName">Workout Mode:</label>
            <select id="splitName">
                </select>
        </div>

        <div class="form-group">
            <label for="volumeLevel">Training Volume:</label>
            <select id="volumeLevel">
                </select>
        </div>

        <div class="form-group">
            <label>Available Equipment:</label>
            <div id="equipmentList" class="checkbox-grid">
                </div>
        </div>

        <button id="generateBtn">Generate Plan</button>

        <div id="results" class="results-container"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
